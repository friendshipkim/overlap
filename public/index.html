<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlap</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-center">
    <div class="card" style="max-width:620px;">
      <h1>Overlap</h1>
      <p class="subtitle">Create a link, share it, and see when everyone is free.</p>

      <div class="form-group">
        <label for="title">Event name</label>
        <input type="text" id="title" placeholder="e.g. Team Sync" autocomplete="off">
      </div>

      <div class="form-group">
        <label>Time range</label>
        <div class="time-range">
          <select id="timeStart"></select>
          <span>to</span>
          <select id="timeEnd"></select>
        </div>
      </div>

      <div class="form-group">
        <label>Select dates</label>
        <div class="cal-month-nav">
          <button class="week-btn" id="prevMonth" onclick="changeMonth(-1)">&#8249;</button>
          <span class="cal-month-label" id="monthLabel"></span>
          <button class="week-btn" id="nextMonth" onclick="changeMonth(1)">&#8250;</button>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="selected-count" id="selectedCount">No dates selected</div>
      </div>

      <button class="btn-primary" id="createBtn">Create Event</button>
    </div>
  </div>

  <script>
    // ── Time dropdowns ───────────────────────────────────────────────
    const timeStart = document.getElementById('timeStart');
    const timeEnd = document.getElementById('timeEnd');

    function formatHour(h) {
      const ampm = h < 12 ? 'AM' : 'PM';
      const hr = h % 12 === 0 ? 12 : h % 12;
      return `${hr}:00 ${ampm}`;
    }

    for (let h = 6; h <= 23; h++) {
      timeStart.appendChild(new Option(formatHour(h), String(h).padStart(2,'0') + ':00'));
      timeEnd.appendChild(new Option(formatHour(h), String(h).padStart(2,'0') + ':00'));
    }
    timeStart.value = '09:00';
    timeEnd.value = '21:00';

    // ── Calendar state ───────────────────────────────────────────────
    const selectedDates = new Set();
    const today = new Date();
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth(); // 0-indexed

    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    const DAY_HEADERS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    function changeMonth(dir) {
      viewMonth += dir;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
      renderCalendar();
    }

    function renderCalendar() {
      const calendar = document.getElementById('calendar');
      calendar.innerHTML = '';

      document.getElementById('monthLabel').textContent = `${MONTHS[viewMonth]} ${viewYear}`;

      // Day headers
      DAY_HEADERS.forEach(d => {
        const h = document.createElement('div');
        h.className = 'cal-header';
        h.textContent = d;
        calendar.appendChild(h);
      });

      // Leading blanks
      const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement('div');
        blank.className = 'cal-blank';
        calendar.appendChild(blank);
      }

      // Days
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const cell = document.createElement('div');
        cell.className = 'cal-day';
        cell.textContent = d;
        if (selectedDates.has(dateStr)) cell.classList.add('selected');
        cell.addEventListener('click', () => {
          if (selectedDates.has(dateStr)) {
            selectedDates.delete(dateStr);
            cell.classList.remove('selected');
          } else {
            selectedDates.add(dateStr);
            cell.classList.add('selected');
          }
          updateCount();
        });
        calendar.appendChild(cell);
      }
    }

    function updateCount() {
      const n = selectedDates.size;
      document.getElementById('selectedCount').textContent =
        n === 0 ? 'No dates selected' : `${n} date${n > 1 ? 's' : ''} selected`;
    }

    renderCalendar();

    // ── Create event ─────────────────────────────────────────────────
    document.getElementById('createBtn').addEventListener('click', async () => {
      const title = document.getElementById('title').value.trim();
      const ts = timeStart.value;
      const te = timeEnd.value;
      const dates = Array.from(selectedDates).sort();

      if (!title) { alert('Please enter an event name.'); return; }
      if (dates.length === 0) { alert('Please select at least one date.'); return; }
      if (ts >= te) { alert('End time must be after start time.'); return; }

      const btn = document.getElementById('createBtn');
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const res = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, dates, timeStart: ts, timeEnd: te })
        });
        const data = await res.json();
        window.location.href = `/event/${data.id}`;
      } catch (e) {
        alert('Something went wrong. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Create Event';
      }
    });
  </script>
</body>
</html>
